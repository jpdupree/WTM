<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WTM Rabbit — Cameras &amp; Athletes</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="assets/style.css" />
  <link rel="stylesheet" href="assets/rabbit.css" />
</head>
<body>
  <header>
    <div class="title">
      <h1>Rabbit — Cameras &amp; Athletes</h1>
      <p class="sub">World's Toughest Mudder 2026</p>
    </div>
  </header>

  <main class="rabbit-main">
    <p class="hint">Camera positions update automatically from Larix
      Broadcaster. Search to add athletes to the course map too.</p>

    <input id="ath-search" type="text" autocomplete="off"
           placeholder="Type a name or bib number…" />
    <div class="row quick-row">
      <button type="button" data-slice="men" class="ghost">Top 10 Men</button>
      <button type="button" data-slice="women" class="ghost">Top 10 Women</button>
      <button type="button" data-slice="teams" class="ghost">Top 10 Teams</button>
      <button id="ath-clear" type="button" class="ghost">Clear</button>
    </div>
    <div id="ath-results" class="results"></div>
    <div id="ath-list" class="ath-list"></div>
    <div id="rabbit-map" class="map-box"></div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="assets/rabbit.js"></script>
</body>
</html>
